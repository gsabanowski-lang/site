<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henri Lemoine — Arbre Généalogique</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap');

  :root{
    --parchment: #f2ead9;
    --parchment-dark: #e6d9bd;
    --ink: #2f2a20;
    --forest: #3c5a44;
    --forest-deep: #23392a;
    --gold: #a97c3f;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(ellipse at top left, rgba(60,90,68,0.06), transparent 60%),
      var(--parchment);
    color: var(--ink);
    font-family:'Jost', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }

  .sheet{
    background:#fffdf8;
    border:1px solid var(--parchment-dark);
    border-top:4px solid var(--forest);
    max-width: 480px;
    width:100%;
    padding: 46px 40px 38px;
    text-align:center;
    box-shadow: 0 10px 30px rgba(47,42,32,0.10);
  }

  .back{
    display:inline-block;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--gold);
    text-decoration:none;
    margin-bottom: 28px;
  }
  .back:hover{ color: var(--forest-deep); }

  .portrait{
    width: 90px;
    height: 90px;
    border-radius:50%;
    border: 2px solid var(--gold);
    background: var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-size: 34px;
    color: var(--forest-deep);
    margin: 0 auto 20px;
  }

  .role{
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size: 36px;
    color: var(--forest-deep);
    margin: 4px 0 6px;
  }

  .dates{
    font-size: 13px;
    color:#8a7d5f;
    letter-spacing:0.5px;
    margin-bottom: 24px;
  }

  .divider{
    width: 70px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 24px;
  }

  .bio{
    font-size: 15px;
    line-height: 1.7;
    color: #4a4433;
  }

  .links{
    margin-top: 28px;
    font-size: 13px;
  }

  .links a{
    color: var(--forest);
    text-decoration: none;
    border-bottom: 1px solid var(--parchment-dark);
  }
  .links a:hover{ color: var(--gold); border-color: var(--gold); }
</style>
</head>
<body>
  <div class="sheet">
    <a class="back" href="../arbre-genealogique.html">&larr; Retour à l'arbre</a>
    <div class="portrait">H</div>
    <div class="role">Grand-père</div>
    <h1>Henri Lemoine</h1>
    <div class="dates">1932 – 2011</div>
    <div class="divider"></div>
    <p class="bio">Né à Lyon, Henri a travaillé toute sa vie comme menuisier. Passionné de jardinage, il a transmis son amour du bois et des plantes à ses enfants et petits-enfants.</p>
    <div class="links"><a href="odette-lemoine.html">Odette Lemoine (épouse)</a> · <a href="philippe-lemoine.html">Philippe Lemoine (fils)</a> · <a href="marc-lemoine.html">Marc Lemoine (fils)</a></div>
  </div>
</body>
</html>
